<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Физика — тренажёр к добору</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>⚛ Физика · тренажёр</h1>
  <p class="sub">1 курс, 2 семестр · теория + задачи в 1–2 действия</p>
</header>

<nav class="tabs">
  <button class="tab" data-mode="plan">🎯 План</button>
  <button class="tab active" data-mode="srs">🧠 Повторение</button>
  <button class="tab" data-mode="cards">🃏 Карточки</button>
  <button class="tab" data-mode="retake">🎓 Пересдача</button>
  <button class="tab" data-mode="exam">Добор (10+10)</button>
  <button class="tab" data-mode="defs">Определения</button>
  <button class="tab" data-mode="forms">Формулы</button>
  <button class="tab" data-mode="practice">Задачи</button>
  <button class="tab" data-mode="all">Всё вместе</button>
</nav>

<div class="controls" id="controls">
  <div class="levels">
    <label><input type="checkbox" class="lvl-cb" value="1" checked> Лёгкий</label>
    <label><input type="checkbox" class="lvl-cb" value="2" checked> Средний</label>
    <label><input type="checkbox" class="lvl-cb" value="3" checked> Сложный</label>
    <label><input type="checkbox" class="lvl-cb" value="4" checked> Экзамен</label>
  </div>
  <div id="topicWrap">
    <button id="topicBtn" class="ghost">Темы: все ▾</button>
    <div id="topicPanel" class="hidden"></div>
  </div>
  <label class="blind-lbl"><input type="checkbox" id="blindCb"> 👁 Слепой режим</label>
  <button id="shuffleBtn" class="ghost">Перемешать</button>
  <button id="accBtn" class="ghost">👤 Войти</button>
  <button id="cheatsheetBtn" class="ghost">📚 Шпаргалка</button>
  <button id="resetBtn" class="ghost">Сброс прогресса</button>
  <span id="counter"></span>
</div>

<div id="cheatsheet" class="hidden"></div>

<main id="app"></main>

<template id="cardTpl">
  <div class="card">
    <div class="card-head">
      <span class="chip topic"></span>
      <span class="chip kind"></span>
    </div>
    <div class="q"></div>
    <div class="options"></div>
    <div class="answer-row">
      <input class="ans-input" type="text" placeholder="Ответ (число)">
      <button class="check-btn">Проверить</button>
      <span class="verdict"></span>
    </div>
    <div class="btns">
      <button class="hint-btn ghost">💡 Подсказка</button>
      <button class="info-btn ghost">📚 Справка</button>
      <button class="sol-btn ghost">📖 Решение</button>
      <button class="next-btn">Следующий →</button>
    </div>
    <div class="hint hidden"></div>
    <div class="info hidden"></div>
    <div class="solution hidden"></div>
  </div>
</template>

<script src="data.js"></script>
<script src="data_extra.js"></script>
<script src="data_med.js"></script>
<script src="data2.js"></script>
<script src="data_exam.js"></script>
<script src="data_retake.js"></script>
<script src="data3.js"></script>
<script src="app.js"></script>
</body>
</html>
